# Anveksha full stack: API + web SPA.
#
# Database connection is driven entirely by .env — set the Supabase
# connection strings before `docker compose -f docker-compose.cloud.yml up`:
#
#     DATABASE_URL=postgresql+psycopg://...pooler.supabase.com:6543/postgres
#     DATABASE_MIGRATION_URL=postgresql+psycopg://...supabase.co:5432/postgres
#
# - api  → FastAPI backend, talks to Supabase Postgres over the network.
# - web  → React SPA built by Vite, served by nginx, which reverse-proxies
#          /api → api:8000 (single origin, no CORS).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: anveksha-api:cloud
    container_name: anveksha-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ../anveksha_ui
      dockerfile: Dockerfile
      args:
        # Relative API base → axios uses same-origin URLs → nginx proxies
        # them to the api service. MSW off so it's all real backend.
        VITE_API_BASE_URL: ""
        VITE_ENABLE_MSW: "false"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    image: anveksha-web:cloud
    container_name: anveksha-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
