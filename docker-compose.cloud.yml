# Anveksha full stack: API + web SPA.
#
# Mongo connection is driven entirely by .env (MONGODB_* schema):
#
#   CLOUD (default) — set the full Atlas srv URI:
#     MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/anveksha?retryWrites=true&w=majority&appName=ReverseHR
#     docker compose -f docker-compose.cloud.yml up --build
#
#   LOCAL dev — run a throwaway mongo container instead of the cloud:
#     leave MONGODB_URI unset (the API builds the URI from MONGODB_USERNAME/
#     MONGODB_PASSWORD/MONGODB_DB_NAME against the `mongo` service), then:
#     docker compose -f docker-compose.cloud.yml --profile local up --build
#
# - api  → FastAPI backend. MONGODB_URI (if set) wins; otherwise it builds
#          mongodb://<user>:<pass>@mongo:27017/<db> for the local profile.
# - web  → React SPA built by Vite, served by nginx, which reverse-proxies
#          /api → api:8000 (single origin, no CORS).
# - mongo→ only started with `--profile local`; absent for cloud.

services:
  mongo:
    profiles: ["local"]
    image: mongo:7
    container_name: anveksha-mongo-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USERNAME:-anveksha}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:-changeme}"
      MONGO_INITDB_DATABASE: "${MONGODB_DB_NAME:-anveksha}"
    # No host port published — the API reaches mongo over the internal
    # compose network (mongo:27017). Uncomment to inspect with Compass, and
    # pick a free host port if 27017 is taken (e.g. "27018:27017").
    # ports:
    #   - "27018:27017"
    volumes:
      - mongo_local_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: anveksha-api:cloud
    container_name: anveksha-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      # Only enforced when the `local` profile is active (compose required:false);
      # for the cloud default the mongo service isn't started and this is skipped.
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ../anveksha_ui
      dockerfile: Dockerfile
      args:
        # Relative API base → axios uses same-origin URLs → nginx proxies
        # them to the api service. MSW off so it's all real backend.
        VITE_API_BASE_URL: ""
        VITE_ENABLE_MSW: "false"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    image: anveksha-web:cloud
    container_name: anveksha-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  mongo_local_data:
