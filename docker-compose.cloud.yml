# Anveksha full stack: API + web SPA.
#
# Mongo connection is driven entirely by .env (MONGODB_* schema):
#
#   CLOUD (default) — set the full Atlas srv URI:
#     MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/anveksha?retryWrites=true&w=majority&appName=ReverseHR
#     docker compose -f docker-compose.cloud.yml up --build
#
#   LOCAL dev — run a throwaway mongo container instead of the cloud:
#     leave MONGODB_URI unset (the API builds the URI from MONGODB_USERNAME/
#     MONGODB_PASSWORD/MONGODB_DB_NAME against the `mongo` service), then:
#     docker compose -f docker-compose.cloud.yml --profile local up --build
#
# - api  → FastAPI backend. MONGODB_URI (if set) wins; otherwise it builds
#          mongodb://<user>:<pass>@mongo:27017/<db> for the local profile.
# - web  → React SPA built by Vite, served by nginx, which reverse-proxies
#          /api → api:8000 (single origin, no CORS).
# - mongo→ only started with `--profile local`; absent for cloud.

services:
  mongo:
    profiles: ["local"]
    image: mongo:7
    container_name: anveksha-mongo-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USERNAME:-anveksha}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:-changeme}"
      MONGO_INITDB_DATABASE: "${MONGODB_DB_NAME:-anveksha}"
    # No host port published — the API reaches mongo over the internal
    # compose network (mongo:27017). Uncomment to inspect with Compass, and
    # pick a free host port if 27017 is taken (e.g. "27018:27017").
    # ports:
    #   - "27018:27017"
    volumes:
      - mongo_local_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: anveksha-api:cloud
    container_name: anveksha-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Reach the temporal server over the compose network so /api/workflows/*
      # is functional. The API connects lazily and degrades to 503 if temporal
      # is down, so it does NOT depend_on temporal (starts independently).
      TEMPORAL_HOST: temporal:7233
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      # Only enforced when the `local` profile is active (compose required:false);
      # for the cloud default the mongo service isn't started and this is skipped.
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ../anveksha_ui
      dockerfile: Dockerfile
      args:
        # Relative API base → axios uses same-origin URLs → nginx proxies
        # them to the api service. MSW off so it's all real backend.
        VITE_API_BASE_URL: ""
        VITE_ENABLE_MSW: "false"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    image: anveksha-web:cloud
    container_name: anveksha-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

  # ── Temporal (durable agent workflows, used by /api/workflows/*) ─────────
  temporal-db:
    image: postgres:16-alpine
    container_name: anveksha-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: anveksha-temporal
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy

  # Durable worker — same image as the API, different entrypoint. Talks to
  # cloud Mongo (MONGODB_URI from .env) + the temporal server.
  temporal-worker:
    image: anveksha-api:cloud
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveksha-temporal-worker
    restart: unless-stopped
    command: ["python", "-m", "app.temporal.worker_main"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal:7233
    depends_on:
      temporal:
        condition: service_started

volumes:
  mongo_local_data:
  temporal_db:
