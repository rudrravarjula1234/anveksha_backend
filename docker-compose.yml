# Production-flavoured stack: API + MongoDB.
#
# Variables come from `.env` in the same directory — copy `.env.example`
# to `.env` and edit before `docker compose up`. The API container builds
# from this directory; for live-reload during development use the
# override in `docker-compose.dev.yml`.

services:
  mongo:
    image: mongo:7
    container_name: anveksha-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      # Exposed locally so you can connect with Compass / mongosh. Drop
      # this in production deployments — internal-network only.
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveksha-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the Compose-internal Mongo address. The API's config
      # builds the full URI from username/password/host/port — we just
      # have to point host + port at the Compose service.
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      TEMPORAL_HOST: temporal:7233
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Temporal (durable agent workflows) ──────────────────────────────────────
  temporal-db:
    image: postgres:16-alpine
    container_name: anveksha-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: anveksha-temporal
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy

  # Durable worker — runs the AgentTaskWorkflow + activities. Same image as
  # the API, different entrypoint. Needs Mongo (activities read agent config)
  # and Temporal.
  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveksha-temporal-worker
    restart: unless-stopped
    command: ["python", "-m", "app.temporal.worker_main"]
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      TEMPORAL_HOST: temporal:7233
    depends_on:
      mongo:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  mongo_data:
  mongo_config:
  temporal_db:
