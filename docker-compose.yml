# Production-flavoured stack: API + Supabase Postgres (hosted, over the
# network — no local Postgres container for the app itself).
#
# Variables come from `.env` in the same directory — copy `.env.example`
# to `.env` and edit before `docker compose up`. The API container builds
# from this directory; for live-reload during development use the
# override in `docker-compose.dev.yml`.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveksha-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL (pooled, Supavisor transaction mode) and
      # DATABASE_MIGRATION_URL (direct) come from .env — required, no
      # local-container default (see .env.example).
      TEMPORAL_HOST: temporal:7233
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Postgres (test suite only) ───────────────────────────────────────────
  # The app itself talks to hosted Supabase Postgres over the network (see
  # DATABASE_URL/DATABASE_MIGRATION_URL in .env) — this container exists
  # solely so `pytest` has a real local Postgres to run against (tests use
  # real Postgres types — ARRAY/JSONB/TIMESTAMPTZ — that SQLite can't
  # faithfully emulate). Not used by the `api`/`temporal-worker` services.
  postgres-test:
    image: postgres:16-alpine
    container_name: anveksha-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: anveksha_test
      POSTGRES_PASSWORD: anveksha_test
      POSTGRES_DB: anveksha_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveksha_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["test"]

  # ── Temporal (durable agent workflows) ──────────────────────────────────────
  temporal-db:
    image: postgres:16-alpine
    container_name: anveksha-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: anveksha-temporal
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy

  # Durable worker — runs the AgentTaskWorkflow + activities. Same image as
  # the API, different entrypoint. Needs Postgres (activities read agent
  # config) and Temporal.
  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveksha-temporal-worker
    restart: unless-stopped
    command: ["python", "-m", "app.temporal.worker_main"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal:7233
    depends_on:
      temporal:
        condition: service_started

volumes:
  temporal_db:
