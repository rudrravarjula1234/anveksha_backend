[project]
name = "anveksha-backend"
version = "0.1.0"
description = "Anveksha API — skill verification platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-ulid>=2.7.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  # Fernet encryption for provider credentials (app/agents/credentials.py)
  "cryptography>=42.0.0",
  # ── Database (Supabase Postgres) ──────────────────────────────────────
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2.0",  # async Postgres driver — see app/db/session.py
  "alembic>=1.13.0",
  "greenlet>=3.0.0",  # required by SQLAlchemy's asyncio extension
  # ── Agentic framework (app/agents) ────────────────────────────────────
  # Required: without it every AI agent silently answers from its template
  # fallback instead of calling a model. Pins match the legacy backend.
  "autogen-core==0.7.5",
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai,anthropic,azure,ollama,mcp]==0.7.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "anyio>=4.0.0",
]
# Optional extra for exact OpenAI token counting (app/agents/token_usage).
agents = [
  "tiktoken>=0.5.0",
]
# Durable workflow extra (app/temporal). The API boots without it; the
# /api/workflows/* endpoints return 503 and the worker can't start until
# installed. Pin matches the legacy backend.
temporal = [
  "temporalio>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
